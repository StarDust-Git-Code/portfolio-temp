  <path fill="#0c0b0a" d="M355 560 L445 560 Q450 640 400 655 Q350 640 355 560 Z"/>
  <!-- drawstrings -->
  <path stroke="#3a3835" stroke-width="8" stroke-linecap="round" fill="none" d="M370 630 q-15 70 -5 130"/>
  <path stroke="#3a3835" stroke-width="8" stroke-linecap="round" fill="none" d="M430 630 q15 70 -5 130"/>
  <!-- backpack straps -->
  <path fill="#2b2a28" d="M190 940 q-25 120 -10 260 l70 0 q-15 -140 0 -260 z" opacity=".8"/>
  <path fill="#2b2a28" d="M610 940 q25 120 10 260 l-70 0 q15 -140 0 -260 z" opacity=".8"/>
